global:
  scrape_interval: 15s

otlp:
  promote_resource_attributes:
    - service.name
    - service.instance.id
    - service.version
    - deployment.environment.name

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
    static_configs:
      - targets: ["rabbitmq:15692"]
    metric_relabel_configs:
      - source_labels: [queue]
        regex: '${QUEUE_PREFIX}[.](tasks|retry|dlq)'
        action: keep
