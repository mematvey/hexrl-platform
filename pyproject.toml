[project]
name = "hexrl-platform"
version = "0.1.0"
description = "A platform for learning RL in interactive way with clean visualization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
hexrl-platform = "hexrl_platform.main:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.1.0",
    "ty>=0.0.83",
    "pre-commit>=4.6.2",
]


[tool.pytest.ini_options]
testpaths=["tests"]
asyncio_mode="auto"
pythonpath=["."]

[tool.ruff]
target-version="py312"
line-length=100

[tool.ruff.lint]
select=[
    "E",
    "W",
    "F",
    "I",
    "UP",
    "N",
    "RUF",
    "BLE",
    "ANN",
]
ignore=[
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**"=["ANN"]

[tool.ruff.lint.isort]
known-first-party=["hexrl_platform"]

[tool.ruff.format]
quote-style="double"
