# Maze map: two wall rings with one-cell gaps, so heading straight at the goal fails.
# Pilot (1 seed, 80k steps): random 0.13, shortest path 1.0, DQN ~0.5 and still improving.

[study]
name = "navigation-dqn-maze-v1"
replays = "data/replays/navigation-maze.jsonl"
experiment = "hex-navigation-maze-dqn"
seeds = [1, 2, 3, 4, 5]

[dqn]
total_timesteps = 300_000
learning_rate = 5e-4
buffer_size = 100_000
learning_starts = 1_000
batch_size = 64
gamma = 0.99
train_freq = 4
gradient_steps = 1
target_update_interval = 1_000
exploration_initial_eps = 1.0
exploration_final_eps = 0.05
net_arch = [64, 64]
eval_freq = 10_000
device = "cpu"

[variants."dqn-explore-0.1"]
exploration_fraction = 0.1

[variants."dqn-explore-0.5"]
exploration_fraction = 0.5
