# Fast end-to-end check of the pipeline against a real MLflow server, not a result

[study]
name = "navigation-dqn-smoke"
replays = "data/replays/navigation.jsonl"
experiment = "hex-navigation-dqn-smoke"
seeds = [1]

[dqn]
total_timesteps = 3_000
learning_starts = 500
buffer_size = 3_000
target_update_interval = 500
eval_freq = 1_000
device = "cpu"

[variants."dqn-explore-0.1"]
exploration_fraction = 0.1

[variants."dqn-explore-0.5"]
exploration_fraction = 0.5

# One registered model per map: the model has the map built into its encoder,
# so versions of different maps must never compete for the same alias
[registry]
model_name = "hex-navigation-smoke"
alias = "champion"
tie_tolerance = 0.01
