[project]
name = "hexrl-platform"
version = "0.2.0"
description = "A platform for learning RL in interactive way with clean visualization"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "uvicorn>=0.53.0",
]

[project.scripts]
hexrl-platform = "hexrl_platform.main:main"
hexrl-generate-replays = "hexrl_platform.rl.replay:main"
hexrl-eda = "hexrl_platform.rl.eda:main"
hexrl-experiment = "hexrl_platform.rl.experiment:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
    "httpx>=0.28.0",
    "asgi-lifespan>=2.1.0",
    "ty>=0.0.83",
    "pre-commit>=4.6.2",
    "pytest-cov>=7.1.0",
]
experiments = [
    "matplotlib>=3.10",
    "mlflow>=3.5,<4",
    "pandas>=2.2",
]
mlflow-server = [
    "boto3>=1.43.103",
    "mlflow>=3.5,<4",
    "psycopg2-binary>=2.9.13",
]
rl = [
    "gymnasium>=1.2",
    "stable-baselines3>=2.7",
]
# torch comes from exactly one of these groups: CPU wheels or CUDA 12.8 wheels
rl-cpu = [
    { include-group = "rl" },
    "torch>=2.8",
]
rl-cuda = [
    { include-group = "rl" },
    "torch>=2.8",
]

[tool.uv]
conflicts = [[{ group = "rl-cpu" }, { group = "rl-cuda" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "rl-cpu" },
    { index = "pytorch-cu128", group = "rl-cuda" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true


[tool.pytest.ini_options]
testpaths=["tests"]
asyncio_mode="auto"
pythonpath=["."]

[tool.ruff]
target-version="py312"
line-length=100

[tool.ruff.lint]
select=[
    "E",
    "W",
    "F",
    "I",
    "UP",
    "N",
    "RUF",
    "BLE",
    "ANN",
    "ASYNC",
]
ignore=[
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**"=["ANN"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls=["hexrl_platform.rl.values.Probability"]

[tool.ruff.lint.isort]
known-first-party=["hexrl_platform"]

[tool.ruff.format]
quote-style="double"
