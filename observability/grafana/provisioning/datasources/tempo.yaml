apiVersion: 1

datasources:
  - name: Tempo
    uid: traces
    type: tempo
    access: proxy
    url: http://tempo:3200
    isDefault: true
    jsonData:
      serviceMap:
        datasourceUid: metrics
      tracesToLogsV2:
        datasourceUid: logs
        spanStartTimeShift: '-1m'
        spanEndTimeShift: '1m'
        filterByTraceID: false
        filterBySpanID: false
        customQuery: true
        query: '{service=~".+"} | json | trace_id="$${__trace.traceId}"'
