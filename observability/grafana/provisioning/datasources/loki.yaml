apiVersion: 1

datasources:
  - name: Loki
    uid: logs
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id"[ ]*:[ ]*"([0-9a-f]{32})"'
          datasourceUid: traces
          url: '$${__value.raw}'
