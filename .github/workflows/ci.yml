name: CI

on:
  pull_request:
  push:
    branches: [main, deploy]

env:
  POSTGRES_USER: ci
  POSTGRES_PASSWORD: ci
  POSTGRES_DB: ci

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen --group experiments --group rl-cpu --group inference

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Format check
        run: uv run --no-sync ruff format --check .

      - name: Tests with coverage
        run: uv run --no-sync pytest --cov=hexrl_platform --cov-report=term-missing --cov-fail-under=80

  docker-build:
    runs-on: ubuntu-latest
    needs: checks
    strategy:
      matrix:
        include:
          - image: hexrl-platform
            dockerfile: Dockerfile
          - image: hexrl-inference
            dockerfile: Dockerfile.inference
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.image }} image
        run: docker build -f ${{ matrix.dockerfile }} -t ${{ matrix.image }}:ci .
